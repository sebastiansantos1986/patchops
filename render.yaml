services:
  - type: web
    name: patchops-dashboard-sebastiansantos1986
    runtime: static
    buildCommand: npm run build:web
    staticPublishPath: ./dist-web
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /config.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: patchops-api-sebastiansantos1986
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      # Let Node use most of the instance's memory (its default stops at about half).
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: PATCHOPS_ENROLLMENT_TOKEN
        generateValue: true
      - key: PATCHOPS_DASHBOARD_USERNAME
        value: admin
      - key: PATCHOPS_DASHBOARD_PASSWORD
        generateValue: true
      - key: PATCHOPS_SESSION_SECRET
        generateValue: true
      # Intune / Jamf / CrowdStrike credentials stay on your own computer. Its PatchOps uploads
      # the synced device data here with this token (see docs/relay.md).
      - key: PATCHOPS_RELAY_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: patchops-postgres-sebastiansantos1986
          property: connectionString

databases:
  - name: patchops-postgres-sebastiansantos1986
    plan: free
    databaseName: patchops
    user: patchops
    ipAllowList: []
