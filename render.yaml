services:
  - type: web
    name: patchops-dashboard-sebastiansantos1986
    runtime: static
    buildCommand: npm run build:web
    staticPublishPath: ./dist-web
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /config.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: patchops-api-sebastiansantos1986
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: PATCHOPS_ENROLLMENT_TOKEN
        generateValue: true
      - key: PATCHOPS_DASHBOARD_USERNAME
        value: admin
      - key: PATCHOPS_DASHBOARD_PASSWORD
        generateValue: true
      - key: PATCHOPS_SESSION_SECRET
        generateValue: true
      # Fleet Posture connectors (read-only). Fill these in the Render dashboard; see docs/fleet-posture.md
      - key: INTUNE_TENANT_ID
        sync: false
      - key: INTUNE_CLIENT_ID
        sync: false
      - key: INTUNE_CLIENT_SECRET
        sync: false
      - key: JAMF_URL
        sync: false
      - key: JAMF_CLIENT_ID
        sync: false
      - key: JAMF_CLIENT_SECRET
        sync: false
      - key: CROWDSTRIKE_CLIENT_ID
        sync: false
      - key: CROWDSTRIKE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: patchops-postgres-sebastiansantos1986
          property: connectionString

databases:
  - name: patchops-postgres-sebastiansantos1986
    plan: free
    databaseName: patchops
    user: patchops
    ipAllowList: []
